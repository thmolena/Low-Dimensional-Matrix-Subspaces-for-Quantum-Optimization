[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "rsqaoa"
version = "0.5.0"
description = "Source-span auditing and complement-robust quantum sensitivity subspaces"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Molena Huynh" }]
dependencies = [
  "numpy>=1.23,<3",
  "torch>=2.0,<3",
  "matplotlib>=3.6,<4",
]

[project.optional-dependencies]
pennylane = ["pennylane>=0.35,<1", "pennylane-lightning>=0.35,<1"]
test = ["pytest>=7,<10", "pytest-cov>=4,<8"]
release = ["build>=1,<2", "twine>=5,<7"]

[project.scripts]
observable-subspaces-reproduce = "hqml_observable_subspaces.authentic_study:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "rsqaoa", "rsqaoa.*",
  "hqml_observable_subspaces", "hqml_observable_subspaces.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.uv]
default-groups = []
